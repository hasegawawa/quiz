const bonusChallenge = {
  title: "BONUS CHALLENGE",
  subtitle: "伊豆ラウンド 特別問題",
  rewardPoints: 300,
  q: "伊豆市・浄蓮の滝観光センターで40年以上前から販売され、伊豆地域で初めて作られた爽やかな緑色の名物ソフトクリームのフレーバーは？",

function MappleQuest() {
  const [screen, setScreen] = useState('intro');
  const [checkedIn, setCheckedIn] = useState([]);
  const [currentCP, setCurrentCP] = useState(null);
  const [onsiteStep, setOnsiteStep] = useState('arrive');
  const [selectedLocation, setSelectedLocation] = useState(null);
  const [missionResult, setMissionResult] = useState(null);
  const [selected, setSelected] = useState(null);
  const [showResult, setShowResult] = useState(false);
  const [bonusAttempts, setBonusAttempts] = useState(0);  // ボーナス挑戦の試行回数
  const [bonusCompleted, setBonusCompleted] = useState(false);  // ボーナスクリア済みか
  const [playerLv, setPlayerLv] = useState(1);
  const [playerXp, setPlayerXp] = useState(0);
  const [mounted, setMounted] = useState(false);
  const [shake, setShake] = useState(false);
  const [attempts, setAttempts] = useState(0);
  const [cpResults, setCpResults] = useState({});

  // 試行回数 → ポイント倍率
  const getScoreMultiplier = (attemptCount) => {
    if (attemptCount === 1) return 1.0;    // 1回目正解 = 100%
    if (attemptCount === 2) return 0.6;    // 2回目正解 = 60%
    if (attemptCount === 3) return 0.3;    // 3回目正解 = 30%
    return 0.1;                             // 4回目以降 = 10%
  };

  // 試行回数 → 称号・アイコン
  const getAttemptRank = (attemptCount) => {
    if (attemptCount === 1) return { label: 'PERFECT', icon: '⭐', color: '#d4a84a', multiplier: '100%' };
    if (attemptCount === 2) return { label: 'GOOD', icon: '✨', color: '#a8c968', multiplier: '60%' };
    if (attemptCount === 3) return { label: 'OK', icon: '🔶', color: '#e07856', multiplier: '30%' };
    return { label: 'CLEAR', icon: '🔸', color: '#8b6f43', multiplier: '10%' };
  };

  useEffect(() => { setMounted(true); }, []);

  const startCheckpoint = (cp) => {
    setCurrentCP(cp);
    setSelected(null);
    setShowResult(false);
    setSelectedLocation(null);
    setMissionResult(null);
    setAttempts(0);  // 新しい問題開始時は試行回数をリセット
    if (cp.type === 'onsite_visit') {
      setOnsiteStep('arrive');
      setScreen('onsite_visit');
    } else {
      setScreen('quiz');
    }
  };

  const handleAnswer = (idx) => {
    if (showResult) return;
    const currentAttempt = attempts + 1;
    setAttempts(currentAttempt);
    setSelected(idx);
    setShowResult(true);
    if (idx === currentCP.quiz.correct) {
      const multiplier = getScoreMultiplier(currentAttempt);
      const earnedXp = Math.round(currentCP.damage * multiplier);
      setCheckedIn([...checkedIn, currentCP.id]);
      setCpResults({ ...cpResults, [currentCP.id]: currentAttempt });
      const newXp = playerXp + earnedXp;
      setPlayerXp(newXp);
      if (newXp >= 500 && playerLv === 1) setPlayerLv(2);
      if (newXp >= 900 && playerLv === 2) setPlayerLv(3);
      setShake(true);
      setTimeout(() => setShake(false), 500);
    }
  };

  // 場所選択（どこに来た？）
  const handleLocationSelect = (locId) => {
    const loc = currentCP.visitQuiz.locations.find(l => l.id === locId);
    setSelectedLocation(loc);
    setSelected(null);
    setShowResult(false);
    setOnsiteStep('mission');
  };

  // ミッション（現地看板問題）の回答
  const handleMissionAnswer = (idx) => {
    if (showResult) return;
    const currentAttempt = attempts + 1;
    setAttempts(currentAttempt);
    setSelected(idx);
    setShowResult(true);
    const correct = idx === selectedLocation.mission.correct;
    setMissionResult(correct ? 'correct' : 'wrong');
    if (correct) {
      const multiplier = getScoreMultiplier(currentAttempt);
      const earnedXp = Math.round(currentCP.damage * multiplier);
      setCheckedIn([...checkedIn, currentCP.id]);
      setCpResults({ ...cpResults, [currentCP.id]: currentAttempt });
      const newXp = playerXp + earnedXp;
      setPlayerXp(newXp);
      if (newXp >= 900 && playerLv === 2) setPlayerLv(3);
      setShake(true);
      setTimeout(() => setShake(false), 500);
    }
  };

  const handleBonusAnswer = (idx) => {
    if (showResult) return;
    const currentAttempt = bonusAttempts + 1;
    setBonusAttempts(currentAttempt);
    setSelected(idx);
    setShowResult(true);
    if (idx === bonusChallenge.correct) {
      const multiplier = getScoreMultiplier(currentAttempt);
      const earnedXp = Math.round(bonusChallenge.rewardPoints * multiplier);
      setPlayerXp(playerXp + earnedXp);
      setBonusCompleted(true);
      setShake(true);
      setTimeout(() => { setShake(false); setScreen('victory'); }, 1200);
    }
  };

  const allCleared = checkedIn.length === checkpoints.length;

  // ====================================================================
  // INTRO
  // ====================================================================
  if (screen === 'intro') {
    return (
      <Frame>
        <div style={{ ...introStyle, opacity: mounted ? 1 : 0, transition: 'opacity 0.8s' }}>
          <Stars />
          <div style={{ position: 'relative', textAlign: 'center', paddingTop: '24px' }}>
            <div style={{ fontSize: '10px', letterSpacing: '0.4em', color: '#d4a84a', marginBottom: '10px' }}>

            </div>
            <h1 style={{
              fontSize: '32px', margin: '0 0 4px', letterSpacing: '0.08em',

              background: 'linear-gradient(180deg, #ffffff 0%, #d4a84a 100%)',
              WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent'
            }}>
              まっぷるCUP
            </h1>
            <div style={{ fontSize: '14px', letterSpacing: '0.15em', color: '#d4a84a', marginBottom: '4px',

              伊豆ラウンド
            </div>
            <div style={{ fontSize: '10px', letterSpacing: '0.3em', color: '#c0c0b0', marginBottom: '20px' }}>
              IZU REGIONAL QUALIFIER
            </div>

            {/* 賞金バナー */}
            <div style={{
              position: 'relative',
              background: 'linear-gradient(135deg, rgba(212, 168, 74, 0.25) 0%, rgba(180, 130, 40, 0.1) 50%, rgba(212, 168, 74, 0.25) 100%)',
              border: '2px solid #d4a84a',
              borderRadius: '4px',
              padding: '20px 16px',
              marginBottom: '20px',
              overflow: 'hidden'

              <div style={{
                position: 'absolute', top: 0, left: 0, right: 0, height: '2px',
                background: 'linear-gradient(90deg, transparent, #d4a84a, transparent)',
                animation: 'shimmer 3s linear infinite'
              }} />
              <div style={{ fontSize: '10px', letterSpacing: '0.3em', color: '#d4a84a', marginBottom: '4px', fontWeight: '700' }}>
                🏆 GRAND PRIZE
              </div>
              <div style={{
                fontSize: '32px', fontWeight: '800',
                fontFamily: '"Hiragino Mincho ProN", serif',
                background: 'linear-gradient(180deg, #fff8d0 0%, #d4a84a 100%)',
                WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent',

                全国47都道府県 地域マスター日本一決定戦
              </div>
            </div>

            {/* 仕組み説明 */}
            <div style={{
              background: 'rgba(20, 20, 30, 0.85)',
              border: '1px solid rgba(212, 168, 74, 0.3)',
              padding: '14px 16px', marginBottom: '20px', borderRadius: '4px',
              textAlign: 'left'
            }}>
              <div style={{ fontSize: '10px', color: '#d4a84a', letterSpacing: '0.2em', fontWeight: '700', marginBottom: '8px' }}>
                ▼ 大会ルール
              </div>
              <div style={{ fontSize: '11px', color: '#e8e8e0', lineHeight: '1.9' }}>
                ①全6問に挑戦してポイント獲得<br />
                ②<span style={{ color: '#d4a84a', fontWeight: '700' }}>{tournamentData.regionQualifyThreshold}pt</span>以上で地域予選突破<br />
                ③<span style={{ color: '#e0c864', fontWeight: '700' }}>{tournamentData.entryRequirement}pt</span>以上で本大会エントリー権獲得<br />
                ④全国上位入賞で優勝賞金100万円🏆
              </div>
            </div>

            <button onClick={() => setScreen('map')} style={startBtnStyle}
              onMouseOver={(e) => { e.target.style.transform = 'translateY(-2px)'; e.target.style.boxShadow = '0 6px 25px rgba(212, 168, 74, 0.6)'; }}
              onMouseOut={(e) => { e.target.style.transform = 'translateY(0)'; e.target.style.boxShadow = '0 4px 20px rgba(212, 168, 74, 0.4)'; }}>
              ▶ 予選エントリー
            </button>

            <div style={{ marginTop: '16px', fontSize: '9px', color: '#a8a898', letterSpacing: '0.15em' }}>
              参加無料 · LINE公式アカウント連携
            </div>
          </div>

          <style>{`
            @keyframes shimmer {
              0% { transform: translateX(-100%); }
              100% { transform: translateX(100%); }
            }
            @keyframes bossFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
          `}</style>
        </div>
      </Frame>
    );
  }

  // ====================================================================
  // MAP
  // ====================================================================
  if (screen === 'map') {
    return (
      <Frame>
        <div style={{
          minHeight: '680px',
          background: 'linear-gradient(180deg, #0a0a0f 0%, #15151f 100%)',
          color: '#f5f5ea', padding: '20px 16px 32px',
          fontFamily: '"Hiragino Sans", sans-serif'
        }}>
          <StatusBar playerLv={playerLv} playerXp={playerXp} cleared={checkedIn.length} total={checkpoints.length} />
          {/* 予選進捗バー */}
          <div style={{
            background: 'linear-gradient(135deg, rgba(212, 168, 74, 0.15) 0%, rgba(180, 130, 40, 0.05) 100%)',
            border: '1px solid rgba(212, 168, 74, 0.4)',
            padding: '14px', marginBottom: '16px', borderRadius: '4px',
            animation: shake ? 'shake 0.5s' : 'none'
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '10px' }}>
              <div>
                <div style={{ fontSize: '9px', color: '#d4a84a', letterSpacing: '0.25em', fontWeight: '700', marginBottom: '2px' }}>
                  🏆 TOURNAMENT PROGRESS
                </div>
                <div style={{ fontSize: '12px', color: '#e8e8e0', letterSpacing: '0.1em' }}>
                  本大会エントリーまで
                </div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontSize: '24px', fontWeight: '700', color: '#d4a84a', lineHeight: 1, fontFamily: '"Hiragino Mincho ProN", serif' }}>
                  {playerXp}
                </div>
                <div style={{ fontSize: '9px', color: '#a8a898', letterSpacing: '0.15em' }}>
                  / {tournamentData.entryRequirement} pt
                </div>
              </div>
            </div>
            <div style={{ height: '10px', background: 'rgba(0,0,0,0.4)', borderRadius: '5px', overflow: 'hidden', position: 'relative' }}>
              {/* 予選突破ライン */}
              <div style={{
                position: 'absolute',
                left: `${(tournamentData.regionQualifyThreshold / tournamentData.entryRequirement) * 100}%`,
                top: 0, bottom: 0, width: '1px',
                background: '#c44536', zIndex: 2
              }} />
              <div style={{
                height: '100%', width: `${Math.min(100, (playerXp / tournamentData.entryRequirement) * 100)}%`,
                background: playerXp >= tournamentData.entryRequirement
                  ? 'linear-gradient(90deg, #d4a84a, #fff8d0, #d4a84a)'
                  : playerXp >= tournamentData.regionQualifyThreshold
                    ? 'linear-gradient(90deg, #4a7c59, #d4a84a)'
                    : 'linear-gradient(90deg, #8b6f1f, #d4a84a)',
                transition: 'all 0.6s',
                boxShadow: playerXp >= tournamentData.regionQualifyThreshold ? '0 0 12px rgba(212, 168, 74, 0.5)' : 'none'
              }} />
            </div>
            {/* ライン凡例 */}
            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '6px', fontSize: '9px', color: '#a8a898' }}>
              <span>0</span>
              <span style={{ color: playerXp >= tournamentData.regionQualifyThreshold ? '#d4a84a' : '#888878' }}>
                🎯 予選突破 {tournamentData.regionQualifyThreshold}
              </span>
              <span style={{ color: playerXp >= tournamentData.entryRequirement ? '#fff8d0' : '#888878' }}>
                🏆 本大会 {tournamentData.entryRequirement}
              </span>
            </div>

            {playerXp >= tournamentData.entryRequirement && (
              <div style={{
                marginTop: '10px', padding: '8px 12px',
                background: 'rgba(212, 168, 74, 0.2)',
                border: '1px solid #d4a84a', borderRadius: '3px',
                fontSize: '11px', color: '#fff8d0', letterSpacing: '0.1em',
                textAlign: 'center', fontWeight: '700',
                animation: 'pulse 2s ease-in-out infinite'
              }}>
                ✨ 本大会エントリー権 獲得！
              </div>
            )}
          </div>

          <div style={{ fontSize: '11px', letterSpacing: '0.2em', color: '#d4a84a', marginBottom: '10px', fontWeight: '600' }}>
            地域クイズ
          </div>

          <div style={{
            display: 'grid',
            gridTemplateColumns: '1fr 1fr',
            gap: '10px', marginBottom: '20px'
          }}>
            {checkpoints.map((cp, i) => {
              const isCleared = checkedIn.includes(cp.id);
              const isOnsite = cp.type === 'onsite_visit';
              const rank = isCleared && cpResults[cp.id] ? getAttemptRank(cpResults[cp.id]) : null;
              return (
                <button
                  key={cp.id}
                  onClick={() => !isCleared && startCheckpoint(cp)}
                  disabled={isCleared}
                  style={{
                    background: '#15151f',
                    border: `1px solid ${isCleared ? '#4a7c59' :
                                          isOnsite ? 'rgba(196, 69, 54, 0.5)' :
                                                     'rgba(255, 255, 255, 0.1)'}`,
                    padding: 0, textAlign: 'left', width: '100%',
                    cursor: isCleared ? 'default' : 'pointer',
                    borderRadius: '8px',
                    overflow: 'hidden',
                    display: 'flex', flexDirection: 'column',
                    fontFamily: 'inherit', opacity: isCleared ? 0.75 : 1,
                    transition: 'all 0.25s',
                    animation: `fadeSlide 0.4s ease ${i * 0.07}s backwards`,
                    boxShadow: '0 2px 8px rgba(0,0,0,0.4)'
                  }}
                  onMouseOver={(e) => {
                    if (!isCleared) {
                      e.currentTarget.style.transform = 'translateY(-3px)';
                      e.currentTarget.style.boxShadow = '0 8px 20px rgba(212, 168, 74, 0.25)';
                    }
                  }}
                  onMouseOut={(e) => {
                    e.currentTarget.style.transform = 'translateY(0)';
                    e.currentTarget.style.boxShadow = '0 2px 8px rgba(0,0,0,0.4)';
                  }}
                >
                  {/* 写真部分 */}
                  <div style={{
                    width: '100%', aspectRatio: '1.3/1',
                    position: 'relative',
                    background: isOnsite
                      ? 'linear-gradient(135deg, #3a1a1a, #2a0a0a)'
                      : '#1a1a28',
                    overflow: 'hidden'
                  }}>
                    {cp.photo && (
                      <img src={cp.photo} alt={cp.name}
                        style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}
                      />
                    )}
                    {isOnsite && !cp.photo && (
                      <div style={{
                        position: 'absolute', inset: 0,
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        flexDirection: 'column', gap: '4px'
                      }}>
                        <div style={{ fontSize: '32px' }}>📍</div>
                        <div style={{ fontSize: '10px', letterSpacing: '0.2em', color: '#e0685a', fontWeight: '700' }}>
                          ONSITE QUEST
                        </div>
                      </div>
                    )}
                    {/* 難易度バッジ（写真右上） */}
                    <div style={{
                      position: 'absolute', top: '6px', right: '6px',
                      fontSize: '8px', padding: '3px 7px',
                      background: cp.difficulty === 'EASY' ? 'rgba(74, 124, 89, 0.95)' :
                                  cp.difficulty === 'MEDIUM' ? 'rgba(212, 168, 74, 0.95)' :
                                  cp.difficulty === 'HARD' ? 'rgba(212, 100, 60, 0.95)' :
                                  'rgba(196, 69, 54, 0.95)',
                      color: cp.difficulty === 'MEDIUM' ? '#1a1008' : '#fff',
                      letterSpacing: '0.1em', fontWeight: '700', borderRadius: '2px'
                    }}>{cp.difficulty}</div>
                    {/* ポイント（写真左下） */}
                    <div style={{
                      position: 'absolute', bottom: '6px', left: '6px',
                      fontSize: '11px', fontWeight: '700',
                      color: '#d4a84a', textShadow: '0 1px 4px rgba(0,0,0,0.9)'
                    }}>
                      +{cp.damage} pt
                    </div>
                    {/* クリア済みオーバーレイ */}
                    {isCleared && (
                      <div style={{
                        position: 'absolute', inset: 0,
                        background: 'rgba(20, 50, 30, 0.75)',
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        flexDirection: 'column', gap: '4px'
                      }}>
                        <div style={{ fontSize: '32px', color: '#78a67e', fontWeight: '700' }}>✓</div>
                        {rank && (
                          <div style={{
                            fontSize: '9px', padding: '3px 8px',
                            background: `${rank.color}40`,
                            border: `1px solid ${rank.color}`,
                            color: rank.color,
                            letterSpacing: '0.1em', fontWeight: '700', borderRadius: '2px'
                          }}>
                            {rank.label}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                  {/* タイトル */}
                  <div style={{ padding: '10px 12px 12px' }}>
                    <div style={{
                      fontSize: '13px', fontWeight: '600',
                      fontFamily: '"Hiragino Mincho ProN", serif',
                      color: isCleared ? '#9a9a9a' : '#ffffff',
                      lineHeight: '1.4',
                      textDecoration: isCleared ? 'line-through' : 'none',
                      minHeight: '36px'
                    }}>
                      {cp.name}
                    </div>
                  </div>
                </button>
              );
            })}
          </div>

          <button
            onClick={() => {
              if (allCleared && !bonusCompleted) {
                setSelected(null); setShowResult(false); setScreen('bonus');
              } else if (allCleared && bonusCompleted) {
                setScreen('victory');
              }
            }}
            disabled={!allCleared}
            style={{
              width: '100%', padding: '18px',
              background: allCleared
                ? 'linear-gradient(135deg, #d4a84a 0%, #8b6f1f 100%)'
                : 'rgba(255,255,255,0.05)',
              border: `1px solid ${allCleared ? '#d4a84a' : 'rgba(255,255,255,0.1)'}`,
              color: allCleared ? '#1a1410' : '#5a5a5a',
              fontSize: '13px', letterSpacing: '0.25em', fontWeight: '700',
              cursor: allCleared ? 'pointer' : 'not-allowed',
              fontFamily: 'inherit', borderRadius: '2px',
              boxShadow: allCleared ? '0 0 30px rgba(212, 168, 74, 0.5)' : 'none',
              animation: allCleared ? 'pulseGold 2s ease-in-out infinite' : 'none'
            }}
          >
            {allCleared && !bonusCompleted ? '🎯 ボーナスチャレンジ +300pt' :
             allCleared && bonusCompleted ? '🏆 大会エントリー画面へ' :
             `🔒 全6問クリアでボーナス解放（${checkedIn.length}/${checkpoints.length}）`}
          </button>

          <style>{`
            @keyframes fadeSlide { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
            @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
            @keyframes pulseGold { 0%,100% { box-shadow: 0 0 30px rgba(212, 168, 74, 0.5); } 50% { box-shadow: 0 0 50px rgba(212, 168, 74, 0.8); } }
            @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
          `}</style>
        </div>
      </Frame>
    );
  }

  // ====================================================================
  // ONSITE VISIT（場所選択型）
  // ====================================================================
  if (screen === 'onsite_visit' && currentCP) {
    // --- Step 1: 到着前の説明 ---
    if (onsiteStep === 'arrive') {
      return (
        <Frame>
          <div style={{
            minHeight: '680px',
            background: 'linear-gradient(180deg, #1a0a0a 0%, #2a1a1a 100%)',
            color: '#f5f5ea', padding: '20px 16px',
            fontFamily: '"Hiragino Sans", sans-serif'
          }}>
            <button onClick={() => setScreen('map')} style={backBtnStyle}>← マップへ</button>

            <div style={{
              textAlign: 'center', padding: '24px 20px',
              background: 'rgba(20, 20, 30, 0.85)',
              border: '1px solid rgba(212, 168, 74, 0.3)',
              borderRadius: '4px', marginBottom: '16px'
            }}>
              <div style={{
                fontSize: '10px', letterSpacing: '0.4em', color: '#c44536',
                marginBottom: '10px', fontWeight: '700'
              }}>
                📍 ONSITE MISSION
              </div>
              <div style={{ fontSize: '44px', marginBottom: '6px' }}>🗺️</div>
              <div style={{
                fontSize: '18px', fontFamily: '"Hiragino Mincho ProN", serif',
                fontWeight: '600', marginBottom: '4px', color: '#f5f5ea'
              }}>
                現地ミッション
              </div>
              <div style={{
                fontSize: '12px', color: '#c0c0b0', marginBottom: '20px'
              }}>
                3ステップでクリアを目指そう
              </div>

              {/* ステップ1〜3をカード式で */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', textAlign: 'left' }}>
                {[
                  { n: '1', title: '今いる場所を選ぶ', desc: '4つの伊豆スポットから、今日訪れた場所を選択' },
                  { n: '2', title: '看板・石碑の問題に答える', desc: '現地にある情報を読んで答える問題' },
                  { n: '3', title: '現地PRと特典をGET', desc: 'クリアすれば、その場所の詳しい情報とクーポンが表示' }
                ].map((step, i) => (
                  <div key={i} style={{
                    display: 'flex', alignItems: 'flex-start', gap: '12px',
                    padding: '10px 12px',
                    background: '#0a0a0f',
                    border: '1px solid rgba(212, 168, 74, 0.2)',
                    borderRadius: '3px'
                  }}>
                    <div style={{
                      width: '26px', height: '26px', flexShrink: 0,
                      background: '#b08830', color: '#fff',
                      borderRadius: '50%',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      fontSize: '13px', fontWeight: '700',
                      fontFamily: '"Hiragino Mincho ProN", serif'
                    }}>
                      {step.n}
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{
                        fontSize: '13px', fontWeight: '600', color: '#f5f5ea',
                        marginBottom: '2px', lineHeight: '1.4',
                        fontFamily: '"Hiragino Mincho ProN", serif'
                      }}>
                        {step.title}
                      </div>
                      <div style={{ fontSize: '10.5px', color: '#c0c0b0', lineHeight: '1.5' }}>
                        {step.desc}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{
              padding: '12px 14px', background: 'rgba(25, 25, 35, 0.7)',
              border: '1px solid rgba(212, 168, 74, 0.2)',
              fontSize: '11px', color: '#e8e8e0', marginBottom: '16px',
              borderRadius: '3px', lineHeight: '1.7'
            }}>
              💡 <strong style={{ color: '#f5f5ea' }}>位置情報は使いません</strong>。現地にいる人だけが看板の情報を読めるので、それが現地証明になります。
            </div>

            <button
              onClick={() => setOnsiteStep('location_select')}
              style={{
                width: '100%', padding: '16px',
                background: 'linear-gradient(135deg, #c44536 0%, #8b2a1f 100%)',
                color: '#fff', border: 'none',
                fontSize: '13px', letterSpacing: '0.3em', fontWeight: '700',
                cursor: 'pointer', fontFamily: 'inherit', borderRadius: '2px',
                boxShadow: '0 4px 20px rgba(196, 69, 54, 0.3)'
              }}
            >
              ▶ スタート
            </button>
          </div>
        </Frame>
      );
    }

    // --- Step 2: 場所を選ぶ ---
    if (onsiteStep === 'location_select') {
      return (
        <Frame>
          <div style={{
            minHeight: '680px',
            background: 'linear-gradient(180deg, #0a0a0f 0%, #15151f 100%)',
            color: '#f5f5ea', padding: '20px 16px',
            fontFamily: '"Hiragino Sans", sans-serif'
          }}>
            <button onClick={() => setOnsiteStep('arrive')} style={backBtnStyle}>← 戻る</button>

            <div style={{
              background: 'rgba(20, 20, 30, 0.85)',
              border: '1px solid rgba(196, 69, 54, 0.3)',
              padding: '16px', marginBottom: '16px', borderRadius: '4px'
            }}>
              <div style={{
                fontSize: '10px', color: '#e0685a', letterSpacing: '0.2em',
                marginBottom: '8px', fontWeight: '700'
              }}>
                📍 STEP 1 / 2
              </div>
              <h3 style={{
                fontSize: '17px', lineHeight: '1.6', margin: '0 0 4px',
                fontFamily: '"Hiragino Mincho ProN", serif', fontWeight: '500'
              }}>
                {currentCP.visitQuiz.q}
              </h3>
              <div style={{ fontSize: '11px', color: '#c0c0b0' }}>
                {currentCP.visitQuiz.subtitle}
              </div>
            </div>

            {/* 4スポットカード */}
            <div style={{
              display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px',
              marginBottom: '16px'
            }}>
              {currentCP.visitQuiz.locations.map((loc, idx) => (
                <button
                  key={loc.id}
                  onClick={() => handleLocationSelect(loc.id)}
                  style={{
                    background: 'rgba(20, 20, 30, 0.85)',
                    border: '1px solid rgba(212, 168, 74, 0.4)',
                    borderRadius: '4px', padding: '0',
                    cursor: 'pointer', fontFamily: 'inherit',
                    overflow: 'hidden', transition: 'all 0.3s',
                    animation: `fadeSlide 0.4s ease ${idx * 0.1}s backwards`,
                    color: '#f5f5ea', textAlign: 'left'
                  }}
                  onMouseOver={(e) => {
                    e.currentTarget.style.borderColor = '#c9b037';
                    e.currentTarget.style.transform = 'translateY(-3px)';
                    e.currentTarget.style.boxShadow = '0 6px 20px rgba(201, 176, 55, 0.2)';
                  }}
                  onMouseOut={(e) => {
                    e.currentTarget.style.borderColor = 'rgba(201, 176, 55, 0.25)';
                    e.currentTarget.style.transform = 'translateY(0)';
                    e.currentTarget.style.boxShadow = 'none';
                  }}
                >
                  <div style={{
                    width: '100%', aspectRatio: '16/10',
                    position: 'relative',
                    background: '#1a1a28',
                    overflow: 'hidden'
                  }}>
                    <img src={loc.pr ? loc.pr.heroPhoto : ''} alt={loc.name}
                      style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}
                    />
                  </div>
                  <div style={{ padding: '10px 12px 12px' }}>
                    <div style={{
                      fontSize: '13px', fontWeight: '600',
                      fontFamily: '"Hiragino Mincho ProN", serif', marginBottom: '3px',
                      color: '#f5f5ea'
                    }}>
                      {loc.name}
                    </div>
                    <div style={{ fontSize: '10px', color: '#c0c0b0', lineHeight: '1.4' }}>
                      {loc.desc}
                    </div>
                  </div>
                </button>
              ))}
            </div>

            <div style={{
              padding: '10px 14px', background: 'rgba(201, 176, 55, 0.08)',
              border: '1px solid rgba(212, 168, 74, 0.3)',
              fontSize: '10px', color: '#d4a84a', lineHeight: '1.7',
              borderRadius: '2px', textAlign: 'center'
            }}>
              選んだ場所の <strong>看板や石碑の問題</strong> に答えてもらいます
            </div>

            <style>{`
              @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
            `}</style>
          </div>
        </Frame>
      );
    }

    // --- Step 3: 現地ミッション（看板問題） ---
    if (onsiteStep === 'mission' && selectedLocation) {
      const mission = selectedLocation.mission;
      const isCorrect = showResult && selected === mission.correct;
      return (
        <Frame>
          <div style={{
            minHeight: '680px',
            background: 'linear-gradient(180deg, #0a0a0f 0%, #15151f 100%)',
            color: '#f5f5ea', padding: '20px 16px',
            fontFamily: '"Hiragino Sans", sans-serif'
          }}>
            <button onClick={() => setOnsiteStep('location_select')} style={backBtnStyle}>← 場所を選び直す</button>

            {/* 選択した場所バナー */}
            <div style={{
              background: 'rgba(20, 20, 30, 0.85)',
              border: '1px solid rgba(212, 168, 74, 0.5)',
              padding: '14px', marginBottom: '14px', borderRadius: '4px',
              display: 'flex', alignItems: 'center', gap: '12px'
            }}>
              <div style={{
                width: '56px', height: '56px', flexShrink: 0,
                borderRadius: '3px', overflow: 'hidden',
                border: '1px solid rgba(212, 168, 74, 0.3)',
                background: '#1a1a28'
              }}>
                <img src={selectedLocation.pr.heroPhoto} alt={selectedLocation.name}
                  style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
              </div>
              <div style={{ flex: 1 }}>
                <div style={{
                  fontSize: '9px', color: '#e0685a', letterSpacing: '0.2em',
                  fontWeight: '700', marginBottom: '2px'
                }}>
                  📍 STEP 2 / 2 · 選択した場所
                </div>
                <div style={{
                  fontSize: '14px', fontFamily: '"Hiragino Mincho ProN", serif',
                  fontWeight: '600'
                }}>
                  {selectedLocation.name}
                </div>
              </div>
            </div>

            {/* ランドマーク指示 */}
            <div style={{
              background: 'rgba(196, 69, 54, 0.08)',
              border: '1px dashed rgba(196, 69, 54, 0.4)',
              padding: '12px 14px', marginBottom: '14px', borderRadius: '3px'
            }}>
              <div style={{
                fontSize: '9px', color: '#e0685a', letterSpacing: '0.2em',
                fontWeight: '700', marginBottom: '6px'
              }}>
                🎯 TARGET
              </div>
              <div style={{
                fontSize: '13px', fontWeight: '600', marginBottom: '4px',
                fontFamily: '"Hiragino Mincho ProN", serif', color: '#f5f5ea'
              }}>
                {mission.landmark}
              </div>
              <div style={{ fontSize: '11px', color: '#e8e8e0', lineHeight: '1.7' }}>
                {mission.hint}
              </div>
            </div>

            {/* 問題 */}
            <div style={{
              background: 'rgba(20, 20, 30, 0.85)',
              border: '1px solid rgba(212, 168, 74, 0.3)',
              padding: '16px 14px', borderRadius: '4px'
            }}>
              <div style={{ fontSize: '10px', color: '#d4a84a', letterSpacing: '0.2em', marginBottom: '10px' }}>
                ▼ MISSION
              </div>
              <h3 style={{
                fontSize: '15px', lineHeight: '1.7', margin: '0 0 16px',
                fontFamily: '"Hiragino Mincho ProN", serif', fontWeight: '500'
              }}>
                {mission.q}
              </h3>

              <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                {mission.options.map((opt, idx) => {
                  const isSel = selected === idx;
                  const isRightAns = idx === mission.correct;
                  let bg = 'rgba(255,255,255,0.03)';
                  let border = '1px solid rgba(201, 176, 55, 0.2)';
                  let color = '#ffffff';
                  let mark = '';
                  if (showResult) {
                    if (isCorrect && isRightAns) {
                      bg = 'rgba(74, 124, 89, 0.25)'; border = '1px solid #78a67e'; mark = '✓';
                    } else if (!isCorrect && isSel) {
                      bg = 'rgba(196, 69, 54, 0.2)'; border = '1px solid #c44536'; mark = '✕';
                    }
                  }
                  return (
                    <button
                      key={idx} onClick={() => handleMissionAnswer(idx)} disabled={showResult}
                      style={{
                        background: bg, border: border, color: color,
                        padding: '13px 14px', fontSize: '13px', textAlign: 'left',
                        cursor: showResult ? 'default' : 'pointer',
                        fontFamily: 'inherit', borderRadius: '2px',
                        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                        transition: 'all 0.25s'
                      }}
                    >
                      <span style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                        <span style={{ fontSize: '10px', color: '#d4a84a', minWidth: '14px' }}>
                          {['A','B','C','D'][idx]}
                        </span>
                        {opt}
                      </span>
                      {mark && <span style={{ fontSize: '14px', fontWeight: '700' }}>{mark}</span>}
                    </button>
                  );
                })}
              </div>

              {showResult && !isCorrect && (
                <div style={{
                  marginTop: '14px', padding: '12px',
                  background: 'rgba(196, 69, 54, 0.1)',
                  borderLeft: '3px solid #c44536', borderRadius: '2px'
                }}>
                  <div style={{
                    fontSize: '11px', fontWeight: '700', color: '#e0685a',

                return (
                  <div key={cp.id} style={{
                    display: 'flex', alignItems: 'center', gap: '10px',
                    padding: '6px 0',
                    borderBottom: '1px dashed rgba(212, 168, 74, 0.15)'

                marginBottom: '10px'

            <button onClick={() => {

            }} style={{
              background: 'rgba(20, 20, 30, 0.6)',
              color: '#e8e8e0', border: '1px solid rgba(212, 168, 74, 0.3)',
              padding: '13px 32px', fontSize: '11px', letterSpacing: '0.25em',

              animation: 'fadeInUp 1.4s ease 1.5s backwards'

}
